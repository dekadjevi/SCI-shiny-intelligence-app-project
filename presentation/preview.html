<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --metro-blue: #003DA5;
    --metro-yellow: #FFD100;
    --metro-dark: #001F52;
    --metro-light: #E8EEF8;
    --metro-gray: #6B7280;
    --metro-border: #D1D9E6;
    --slide-w: 620px;
    --slide-h: 349px;
    font-family: 'Montserrat', sans-serif;
  }

  h2.sr-only { position: absolute; left: -9999px; }

  body { background: transparent; }

  .deck-shell {
    padding: 1rem 0 2rem;
    max-width: 680px;
  }

  .nav-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .nav-btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 4px;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .nav-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
  .nav-btn.active { background: var(--metro-blue); color: #fff; border-color: var(--metro-blue); }

  .slide-viewport {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 6px;
    border: 0.5px solid var(--color-border-tertiary);
    overflow: hidden;
    position: relative;
    background: #fff;
  }

  .slide { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; }
  .slide.active { display: block; }

  .slide-counter {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-top: 8px;
    text-align: right;
    font-family: 'Montserrat', sans-serif;
  }

  .prev-next {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    justify-content: space-between;
    align-items: center;
  }
  .arrow-btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 4px;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    cursor: pointer;
    transition: background 0.15s;
  }
  .arrow-btn:hover { background: var(--color-background-secondary); }
  .arrow-btn:disabled { opacity: 0.35; cursor: default; }
  .arrow-btn:disabled:hover { background: var(--color-background-primary); }

  .slide-title-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-primary);
    font-family: 'Montserrat', sans-serif;
  }

  /* ---- SLIDE INTERNAL STYLES (scoped via SVG / inline) ---- */


  /* Standalone browser compatibility variables */
  :root {
    --color-border-tertiary: #d1d5db;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f3f4f6;
    --color-text-primary: #111827;
    --color-text-secondary: #6b7280;
  }

  html, body {
    width: 100%;
    min-height: 100%;
  }

  body {
    background: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
  }

  .deck-shell {
    width: min(100%, 1100px);
    max-width: 1100px;
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
  }

  .slide-viewport {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
  }

</style>

<h2 class="sr-only">METRO AG SCI Presentation mockup — 19-slide deck overview with navigation</h2>

<div class="deck-shell">

let cur = 0;

function renderNav() {
  const row = document.getElementById('navRow');
  const groups = [
    {label:'Intro',range:[0,2]},
    {label:'Framework',range:[3,5]},
    {label:'KIT 1',range:[6,9]},
    {label:'KIT 2',range:[10,12]},
    {label:'KIT 3',range:[13,15]},
    {label:'Synthesis',range:[16,18]}
  ];
  row.innerHTML = groups.map((g,gi)=>`<button class="nav-btn${cur>=g.range[0]&&cur<=g.range[1]?' active':''}" onclick="jumpGroup(${g.range[0]})">${g.label}</button>`).join('');
}

function jumpGroup(idx) { cur=idx; render(); }

function render() {
  const vp = document.getElementById('viewport');
  vp.innerHTML = slides[cur].html;
  document.getElementById('slideLabel').textContent = slides[cur].label;
  document.getElementById('slideCounter').textContent = `Slide ${cur+1} of ${slides.length}`;
  document.getElementById('prevBtn').disabled = cur===0;
  document.getElementById('nextBtn').disabled = cur===slides.length-1;
  renderNav();
}

function go(dir) { cur=Math.max(0,Math.min(slides.length-1,cur+dir)); render(); }

render();


document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') go(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
});

</script>
